<!doctype html>
<html lang="sv">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f6f7f2">
	<title>Djurprofil – Mina djur</title>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<header class="topbar">
		<div class="topbar-inner">
			<div class="brand"><span class="brand-mark" aria-hidden="true">🐾</span><span>Mina djur</span></div>
			<div class="topbar-right">
				<a class="logout-button" href="/">Till mina djur</a>
				<button class="logout-button" id="logoutButton" type="button">Logga ut</button>
			</div>
		</div>
	</header>
	<main class="page">
		<div id="notice" class="notice" role="status" aria-live="polite"></div>

		<section class="panel profile-panel" aria-labelledby="profile-title">
			<div class="profile-head">
				<span class="animal-icon profile-icon" id="profileIcon">🐾</span>
				<div>
					<h1 id="profile-title">Laddar...</h1>
					<span class="animal-type" id="profileType"></span>
				</div>
			</div>

			<div class="profile-gallery" id="gallery" aria-label="Bilder"></div>
			<form id="photoForm" class="photo-form">
				<label for="photoInput">Lägg till bild</label>
				<input id="photoInput" name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required>
				<button class="primary" type="submit">Ladda upp bild</button>
				<span class="field-hint">JPEG, PNG, WEBP eller GIF, max 8 MB.</span>
			</form>

			<form id="profileForm" class="log-form profile-form">
				<label for="name">Namn</label>
				<input id="name" name="name" required maxlength="60">

				<label for="type">Djurart</label>
				<input id="type" name="type" required maxlength="40">

				<label for="breed">Ras / variant <span style="font-weight:400;color:#78827a">(valfritt)</span></label>
				<input id="breed" name="breed" list="breed-options" maxlength="100" placeholder="Välj eller skriv ras/variant">
				<datalist id="breed-options"></datalist>

				<label for="birthday">Födelsedatum <span style="font-weight:400;color:#78827a">(valfritt)</span></label>
				<input id="birthday" name="birthday" type="date">

				<label for="sex">Kön <span style="font-weight:400;color:#78827a">(valfritt)</span></label>
				<select id="sex" name="sex">
					<option value="">Okänt</option>
					<option value="Hona">Hona</option>
					<option value="Hane">Hane</option>
				</select>

				<label class="checkbox-label" for="neutered">
					<input id="neutered" name="neutered" type="checkbox">
					Kastrerad
				</label>

				<label for="initialWeight">Startvikt i kg <span style="font-weight:400;color:#78827a">(valfritt)</span></label>
				<input id="initialWeight" name="initialWeight" type="number" min="0.01" max="1000" step="0.01" inputmode="decimal">

				<label for="allergies" class="full">Allergier / specialbehov</label>
				<textarea id="allergies" name="allergies" class="full" maxlength="500" placeholder="T.ex. foderallergi, kroniska tillstånd..."></textarea>

				<label for="microchipId">Chipnummer</label>
				<input id="microchipId" name="microchipId" maxlength="40">

				<label for="vetName">Veterinärklinik</label>
				<input id="vetName" name="vetName" maxlength="100">

				<label for="vetPhone">Veterinärens telefonnummer</label>
				<input id="vetPhone" name="vetPhone" maxlength="40">

				<label for="insuranceCompany">Försäkringsbolag</label>
				<input id="insuranceCompany" name="insuranceCompany" maxlength="100">

				<label for="insuranceNumber">Försäkringsnummer</label>
				<input id="insuranceNumber" name="insuranceNumber" maxlength="60">

				<label for="foodType">Foder</label>
				<input id="foodType" name="foodType" maxlength="200" placeholder="T.ex. Royal Canin torrfoder">

				<label for="foodAmount">Mängd per gång</label>
				<input id="foodAmount" name="foodAmount" maxlength="100" placeholder="T.ex. 60 g">

				<label for="foodFrequency">Hur ofta</label>
				<input id="foodFrequency" name="foodFrequency" maxlength="100" placeholder="T.ex. 2 gånger per dag">

				<h2 class="full pedigree-heading">Uppfödning och föräldrar</h2>
				<label for="breeder">Uppfödare</label>
				<input id="breeder" name="breeder" maxlength="100">

				<label for="fatherName">Far – namn</label>
				<input id="fatherName" name="fatherName" maxlength="100">

				<label for="fatherColorPattern">Far – färg &amp; teckning</label>
				<input id="fatherColorPattern" name="fatherColorPattern" maxlength="100">

				<label for="fatherCoat">Far – hårlag</label>
				<input id="fatherCoat" name="fatherCoat" maxlength="100">

				<label for="motherName">Mor – namn</label>
				<input id="motherName" name="motherName" maxlength="100">

				<label for="motherColorPattern">Mor – färg &amp; teckning</label>
				<input id="motherColorPattern" name="motherColorPattern" maxlength="100">

				<label for="motherCoat">Mor – hårlag</label>
				<input id="motherCoat" name="motherCoat" maxlength="100">

				<label for="info" class="full">Övrig information</label>
				<textarea id="info" name="info" class="full" maxlength="1000"></textarea>

				<button class="primary full" type="submit">Spara ändringar</button>
			</form>
		</section>

		<section class="panel content-panel" aria-labelledby="reminders-title">
			<div class="list-heading">
				<div class="list-title"><h2 id="reminders-title">Påminnelser</h2></div>
			</div>
			<p class="field-hint">Nästa datum räknas ut automatiskt utifrån senaste anteckningen av varje typ. Du kan ändra intervallet per djur.</p>
			<div id="reminderList" class="reminder-list"></div>
		</section>

		<section class="panel content-panel" aria-labelledby="weight-title">
			<div class="list-heading">
				<div class="list-title"><h2 id="weight-title">Viktutveckling</h2></div>
			</div>
			<div id="weightChart"></div>
		</section>

		<section class="panel content-panel" aria-labelledby="history-title">
			<div class="list-heading">
				<div class="list-title"><h2 id="history-title">Skötsel &amp; historik</h2></div>
				<a id="exportLink" class="text-button" href="#">Exportera som CSV</a>
			</div>
			<form id="logForm" class="log-form"></form>
			<div id="logList" class="log-list"></div>
		</section>
	</main>
	<script src="/breeds.js"></script>
	<script src="/animal.js"></script>
</body>
</html>
